# nRF52832 gateway (board id NRF52832_GATEWAY): UART (CH340 on the board, the
# interface MCU's virtual COM port on the nRF52 DK), 64 KiB RAM. Subject to
# resource qualification (docs/qualification/nrf52832_gateway.md).
CONFIG_CTAG_GW_BOARD_ID=2

# Stacks trimmed from the provisioner sample's figures; must be re-measured
# with debug/rtt.conf (CONFIG_THREAD_ANALYZER) during qualification. main runs
# the start-up and then the gateway loop.
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560
CONFIG_BT_MESH_SETTINGS_WORKQ_STACK_SIZE=1400
CONFIG_BT_MESH_ADV_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2560

# Delivery queue: up to three layouts behind the active one, within a 5 KiB
# arena (one LAYOUT_SERIAL_MAX layout plus a typical ~1 KiB one, or four
# typical ones); BUSY beyond.
CONFIG_CTAG_GW_DELIVERY_QUEUE=3
CONFIG_CTAG_GW_LAYOUT_ARENA=5120
CONFIG_CTAG_GW_TX_FRAME=2048
CONFIG_CTAG_GW_EVQ_BYTES=768
CONFIG_CTAG_GW_UART_RX_RING=768
CONFIG_CTAG_GW_UART_TX_RING=256
CONFIG_CTAG_GW_AT_BRIDGE=12
CONFIG_CTAG_GW_RESULT_DEDUP=32
CONFIG_CTAG_GW_REPORTED=32
CONFIG_CTAG_GW_ASSIGN_MAX=24
CONFIG_CTAG_GW_EVQ_DEPTH=16

# Host and mesh buffers: no connections, so few HCI event buffers; adverts
# arrive in the discardable pool.
CONFIG_BT_BUF_EVT_RX_COUNT=4
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=10
CONFIG_BT_MESH_ADV_BUF_COUNT=10
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=2
CONFIG_BT_MESH_MSG_CACHE_SIZE=16
CONFIG_BT_MESH_CRPL=8
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=20
