# nRF52840 gateway (board id NRF52840DK_GATEWAY): USB CDC ACM, 256 KiB RAM.
CONFIG_CTAG_GW_BOARD_ID=1

# Host link: USB CDC ACM with the device_next stack (firmware-notes 7). The
# USB serial number is the device id (HWINFO): the companion's gateway id.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Cremind"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Cremind Tag gateway"
# pid.codes test VID/PID (1209:0002), not the Zephyr sample default: replace
# with an allocated pair before shipping hardware.
CONFIG_CDC_ACM_SERIAL_VID=0x1209
CONFIG_CDC_ACM_SERIAL_PID=0x0002

# Entropy from the RNG peripheral, never the CryptoCell library
# (firmware-notes correction 9; socs/nrf52840.overlay chooses &rng).
CONFIG_ENTROPY_CC3XX=n

# Stacks from the Zephyr mesh provisioner sample's thread analysis (+50 %);
# re-measure with debug/rtt.conf (CONFIG_THREAD_ANALYZER) on hardware. main
# runs the start-up (settings, self-configuration) and then the gateway loop.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_MESH_SETTINGS_WORKQ_STACK_SIZE=1700
CONFIG_BT_MESH_ADV_STACK_SIZE=4000
CONFIG_BT_RX_STACK_SIZE=3300

# Room for the full protocol: four queued layouts behind the active one, all
# of them LAYOUT_SERIAL_MAX bytes if need be.
CONFIG_CTAG_GW_DELIVERY_QUEUE=4
CONFIG_CTAG_GW_LAYOUT_ARENA=20480
CONFIG_CTAG_GW_TX_FRAME=2560
CONFIG_CTAG_GW_EVQ_BYTES=2048
CONFIG_CTAG_GW_UART_RX_RING=1024
CONFIG_CTAG_GW_UART_TX_RING=1024
