# nRF52840 gateway (board id NRF52840DK_GATEWAY): USB CDC ACM, 256 KiB RAM.
CONFIG_CTAG_GW_BOARD_ID=1

# Host link: USB CDC ACM with the device_next stack (firmware-notes 7). The
# USB serial number is the device id (HWINFO): the companion's gateway id.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Cremind"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Cremind Tag gateway"
# pid.codes test VID/PID (1209:0002), not the Zephyr sample default: replace
# with an allocated pair before shipping hardware.
CONFIG_CDC_ACM_SERIAL_VID=0x1209
CONFIG_CDC_ACM_SERIAL_PID=0x0002

# Entropy from the RNG peripheral, never the CryptoCell library
# (firmware-notes correction 9; socs/nrf52840.overlay chooses &rng).
CONFIG_ENTROPY_CC3XX=n

# Stacks from the Zephyr mesh provisioner sample's thread analysis (+50 %);
# re-measure with debug/rtt.conf (CONFIG_THREAD_ANALYZER) on hardware. main
# runs the start-up (settings, self-configuration) and then the gateway loop,
# which under v2 also runs X25519, Ed25519 and ChaCha20-Poly1305: the static
# call-graph analysis (-fstack-usage -fcallgraph-info, docs/gateway-firmware.md
# 15.11) puts its deepest chain at 9,916 B, through HACL*'s Ed25519
# verification (a 6,432-byte frame: two precomputed point tables) under a
# grant check. 12 KiB leaves ~2.3 KiB for exception frames and the chains the
# analysis cannot follow (function pointers: settings writes, the RNG).
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_MESH_SETTINGS_WORKQ_STACK_SIZE=1700
CONFIG_BT_MESH_ADV_STACK_SIZE=4000
CONFIG_BT_RX_STACK_SIZE=3300

# Protocol v2 (docs/connect-setup.md, docs/gateway-firmware.md "Protocol v2"):
# device identity, ownership, Noise IK sessions (lib/secure: Noise* + HACL*),
# static-OOB provisioning, DISCOVER and tunnels, the button factory reset.
# The secure heap holds a session (~0.8 KiB) and twice the largest sealed or
# opened message (a 4 KiB SECURE_DATA carrying a full DELIVER_LAYOUT).
CONFIG_CTAG_GW_SECURE=y
CONFIG_CTAG_SECURE_HEAP_SIZE=12288
CONFIG_CTAG_GW_TUNNELS=2
# connect-setup.md 3.4: static OOB over HMAC-SHA256 only (the provisioner's
# capabilities callback refuses anything else; the option below only affects
# the gateway's own provisionee role, which it never uses over PB-ADV).
CONFIG_BT_MESH_ECDH_P256_HMAC_SHA256_AES_CCM=y
CONFIG_BT_MESH_OOB_AUTH_REQUIRED=y
# The factory-reset button and LED (reset.c).
CONFIG_GPIO=y

# Tags on the gateway's own radio (docs/protocol.md 11, docs/gateway-firmware.md
# 16): two tag links (caps.tag_links), eight own-radio tunnels, the shared
# connection scheduler (lib/sched) and GATT fragmentation (lib/frag). The
# Bluetooth options are the bridge's for a central with a GATT client
# (apps/bridge/prj.conf): ATT MTU 23 (fragments of ATT_VALUE_MAX bytes), no
# automatic parameter updates or GATT caching, and TX buffers above the DATA
# fragments of both links in flight (2 x CTAG_GW_LINK_INFLIGHT = 8 < 12, a
# write never waits on the gateway loop; central.c asserts it); the host
# wants more HCI event buffers than ACL TX buffers.
CONFIG_CTAG_GW_RADIO=y
CONFIG_CTAG_GW_TAG_LINKS=2
CONFIG_CTAG_GW_RADIO_TUNNELS=8
CONFIG_CTAG_GW_LINK_INFLIGHT=4
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_L2CAP_TX_MTU=23
CONFIG_BT_BUF_ACL_RX_SIZE=27
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_ATT_TX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_EVT_RX_COUNT=16

# Room for the full protocol: four queued layouts behind the active one, all
# of them LAYOUT_SERIAL_MAX bytes if need be.
CONFIG_CTAG_GW_DELIVERY_QUEUE=4
CONFIG_CTAG_GW_LAYOUT_ARENA=20480
CONFIG_CTAG_GW_TX_FRAME=2560
CONFIG_CTAG_GW_EVQ_BYTES=2048
CONFIG_CTAG_GW_UART_RX_RING=1024
CONFIG_CTAG_GW_UART_TX_RING=1024
