CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384

CONFIG_CTAG_FRAME=y
CONFIG_CTAG_CBOR=y

# SHA-256 for LAYOUT_BEGIN.digest through PSA (Mbed TLS on the host).
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_ENTROPY_GENERATOR=y

# Small queues so the limits are reached quickly: two queued records behind
# the active one, and an arena for two full-size layouts.
CONFIG_CTAG_GW_DELIVERY_QUEUE=2
CONFIG_CTAG_GW_LAYOUT_ARENA=8192
