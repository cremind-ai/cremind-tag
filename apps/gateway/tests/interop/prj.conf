# Gateway interop build (native_sim): the gateway's serial side on a PTY.
CONFIG_CTAG_FRAME=y
CONFIG_CTAG_CBOR=y
# The simulated bridges reassemble with the library's assembler.
CONFIG_CTAG_LAYOUT=y

# SHA-256 through PSA (Mbed TLS on the host).
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_ENTROPY_GENERATOR=y

# The gateway's UART glue on the native PTY UART (interrupt-driven emulation).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
# uart0 belongs to the protocol: printk goes to the process's stdout.
CONFIG_UART_CONSOLE=n
CONFIG_POSIX_ARCH_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n

# Real time, so the companion's 2 s timeouts mean what they say.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# The nRF52840 gateway's sizes.
CONFIG_CTAG_GW_DELIVERY_QUEUE=4
CONFIG_CTAG_GW_LAYOUT_ARENA=20480
CONFIG_CTAG_GW_TX_FRAME=2560
CONFIG_CTAG_GW_EVQ_BYTES=2048
CONFIG_CTAG_GW_EVQ_DEPTH=64
