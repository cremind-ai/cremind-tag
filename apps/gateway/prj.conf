# Cremind Tag gateway: every target. Per-SoC fragments in socs/, per-board in
# boards/ (docs/building.md). Debug logging over RTT: debug/rtt.conf
# (docs/gateway-firmware.md "Debugging").

# ---- Libraries (docs/firmware-libs.md) ----
CONFIG_CTAG_FRAME=y
CONFIG_CTAG_CBOR=y

# ---- Bluetooth: the Zephyr controller (bt-ll-sw-split snippet); the mesh
# needs only an observer and a broadcaster, never a connection ----
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=y
CONFIG_BT_DEVICE_NAME="Cremind Tag gateway"
# Keep controller crypto (firmware-notes correction 8).
CONFIG_BT_CTLR_CRYPTO=y
CONFIG_BT_CTLR_DUP_FILTER_LEN=0
CONFIG_BT_CTLR_PRIVACY=n

# ---- Bluetooth Mesh: provisioner, CDB, configuration client (protocol.md 2) ----
CONFIG_BT_MESH=y
CONFIG_BT_MESH_PROVISIONER=y
CONFIG_BT_MESH_PROVISIONEE=n
CONFIG_BT_MESH_PB_ADV=y
CONFIG_BT_MESH_PB_GATT=n
CONFIG_BT_MESH_GATT_PROXY=n
CONFIG_BT_MESH_FRIEND=n
CONFIG_BT_MESH_LOW_POWER=n
CONFIG_BT_MESH_RELAY=n
CONFIG_BT_MESH_CDB=y
# The gateway itself plus MAX_BRIDGES bridges.
CONFIG_BT_MESH_CDB_NODE_COUNT=6
CONFIG_BT_MESH_CDB_SUBNET_COUNT=1
CONFIG_BT_MESH_CDB_APP_KEY_COUNT=1
CONFIG_BT_MESH_SUBNET_COUNT=1
CONFIG_BT_MESH_APP_KEY_COUNT=1
CONFIG_BT_MESH_MODEL_KEY_COUNT=1
CONFIG_BT_MESH_MODEL_GROUP_COUNT=1
CONFIG_BT_MESH_LABEL_COUNT=0
CONFIG_BT_MESH_CFG_CLI=y
CONFIG_BT_MESH_HEALTH_CLI=y
# Never the legacy advertiser (firmware-notes correction 4).
CONFIG_BT_MESH_ADV_EXT=y
CONFIG_BT_MESH_DEFAULT_TTL=5
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=3
CONFIG_BT_MESH_NETWORK_TRANSMIT_INTERVAL=20
# 160-byte vendor parameters need >= MESH_MIN_SEG segments. The gateway sends
# one segmented message at a time (3.2 rule 1); the second slot only absorbs a
# configuration-client message whose status came before its segment ACK.
CONFIG_BT_MESH_TX_SEG_MAX=16
CONFIG_BT_MESH_RX_SEG_MAX=16
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=2
# Results (DELIVERY_RESULT, 44 access bytes) from several bridges at once.
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=4
CONFIG_BT_MESH_ADV_BUF_COUNT=16
CONFIG_BT_MESH_CRPL=16
# Replay list written every 10 minutes, not on every message (flash wear).
CONFIG_BT_MESH_RPL_STORE_TIMEOUT=600

# ---- Storage: mesh state and the gateway's records (settings on NVS) ----
# Link into the code partition so the image can never grow into the settings.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# ---- Crypto: PSA (the mesh requires it); SHA-256 for the layout digest ----
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_ENTROPY_GENERATOR=y
# With BT_SETTINGS every mesh key is a persistent PSA key (secure storage):
# the subnet's derived keys, the app key, the device key, and in the CDB the
# net key, the app key and one device key per node (MAX_BRIDGES + 1), plus the
# provisioning ECDH key (firmware-notes 3). NCS defaults to 16 slots.
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=24

# ---- Advertising: the provisioner's own messages only (no relay, proxy or
# friend sets; NCS sizes 5 for a relay node) ----
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
CONFIG_BT_CTLR_ADV_SET=1

# ---- Kernel and drivers ----
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
# Bluetooth API from cooperative threads only (the mesh provisioner sample).
CONFIG_MAIN_THREAD_PRIORITY=-2

# ---- Release build: no console or logging (the serial link belongs to the
# companion); debug/rtt.conf routes logs to RTT. ----
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_ASSERT=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
