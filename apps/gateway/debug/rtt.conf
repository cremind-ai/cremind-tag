# Debug build only (docs/gateway-firmware.md "Debugging"): logs and the thread
# analyzer over SEGGER RTT, so the serial link stays the companion's. Lean
# enough for the nRF52832 (minimal log mode: no log thread or buffer).
#   west build ... -- -DZEPHYR_EXTRA_MODULES=/work -DEXTRA_CONF_FILE=debug/rtt.conf
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=512
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_ASSERT=y
CONFIG_BT_MESH_LOG_LEVEL_WRN=y
# Stack high-water marks every 30 s (resource qualification).
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=768
