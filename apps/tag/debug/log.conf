# Debug build only (docs/tag-firmware.md "Debugging"): minimal UART log on the
# board's debug TX pad (debug/uart0.overlay). Measured: Laowu BW 106,988 B
# flash / 1,900 B RAM free, Laowu BWR 107,140 B / 1,892 B: below the 2 KiB
# release RAM target, so never ship it.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_BACKEND_UART=y
