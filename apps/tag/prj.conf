# Cremind Tag firmware, every tag target (docs/tag-firmware.md).
# Per-SoC stack sizes: socs/<soc>.conf. Fragment provenance:
# docs/firmware-notes.md section 12 (base, "min", "crypto-lean").

# ---- Bluetooth: legacy connectable peripheral, one link, ATT MTU 23 ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CTag"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_EXT_ADV=n
CONFIG_BT_L2CAP_TX_MTU=23
# Link security is the application's (docs/security.md): no SMP, no pairing.
CONFIG_BT_SMP=n
# Controller crypto stays on: =n selects host crypto -> PSA + heap
# (firmware-notes correction 8).
CONFIG_BT_CTLR_CRYPTO=y
# Host RX in the system work queue on every tag SoC: the GATT callbacks, the
# core, the panel poll and the crypto share one cooperative context (no
# locking) and no BT RX thread stack is allocated.
CONFIG_BT_RECV_WORKQ_SYS=y

# ---- Cremind Tag libraries (docs/firmware-libs.md) ----
CONFIG_CTAG_FRAG=y
CONFIG_CTAG_SESSION=y
CONFIG_CTAG_TXN=y
CONFIG_CTAG_ENROLL=y

# ---- crypto-lean: PSA with HMAC-built HKDF, CCM-8, SHA-256; nonces from
# sys_csrand_get(); all crypto in one thread; one volatile key at a time ----
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_AES_KEY_SIZE_128=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_GENERATE_RANDOM=n
CONFIG_MBEDTLS_THREADING_C=n
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=1

# ---- peripherals ----
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# ---- code size ----
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# ---- release build: no logging, no console ----
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# ---- "min": kernel ----
CONFIG_MAIN_STACK_SIZE=512
CONFIG_ISR_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=128
CONFIG_HW_STACK_PROTECTION=n
CONFIG_TIMESLICING=n
CONFIG_ASSERT=n
CONFIG_BT_ASSERT=n
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_CBPRINTF_NANO=y
CONFIG_NUM_PREEMPT_PRIORITIES=8

# ---- "min": host ----
CONFIG_BT_TX_PROCESSOR_THREAD=n
CONFIG_BT_BUF_EVT_RX_COUNT=4
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_ACL_TX_COUNT=2
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=2
CONFIG_BT_ATT_TX_COUNT=2
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GATT_READ_MULTIPLE=n
CONFIG_BT_GATT_READ_MULT_VAR_LEN=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_HCI_VS=n
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# ---- "min": controller ----
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_CTLR_CONN_PARAM_REQ=n
CONFIG_BT_CTLR_EXT_REJ_IND=n
CONFIG_BT_CTLR_PER_INIT_FEAT_XCHG=n
CONFIG_BT_CTLR_MIN_USED_CHAN=n
CONFIG_BT_CTLR_CHAN_SEL_2=n
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_CTLR_FILTER_ACCEPT_LIST=n
CONFIG_BT_CTLR_DTM_HCI=n
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
