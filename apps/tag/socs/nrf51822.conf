# nRF51822 / nRF51802 (Laowu BW, BWR): 16 KiB SRAM.
# "tight" (docs/firmware-notes.md 12): APP_TIGHT_CTLR_STACKS defaults to y on
# nRF51 (app Kconfig), plus one HCI event buffer less.
CONFIG_BT_BUF_EVT_RX_COUNT=3
# The system work queue carries host RX/TX, the crypto and the panel driver.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
