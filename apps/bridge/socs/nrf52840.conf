# nRF52840 bridge (board id NRF52840_BRIDGE).
CONFIG_CTAG_BRIDGE_BOARD_ID=3

# Maintenance port: USB CDC ACM with the device_next stack (firmware-notes 7).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Cremind"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Cremind Tag bridge"
# pid.codes test VID/PID (1209:0001), not the Zephyr sample default: replace
# with an allocated pair before shipping hardware.
CONFIG_CDC_ACM_SERIAL_VID=0x1209
CONFIG_CDC_ACM_SERIAL_PID=0x0001

# Entropy from the RNG peripheral, never the CryptoCell library
# (firmware-notes correction 9; socs/nrf52840.overlay chooses &rng).
CONFIG_ENTROPY_CC3XX=n

# External flash on QSPI (4 KiB erase sectors).
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# 256 KiB of RAM: full-size maintenance frames and a larger read cache.
CONFIG_CTAG_BRIDGE_MAINT_MAX_FRAME=4096
CONFIG_CTAG_BRIDGE_MAINT_TX_FRAME=1536
CONFIG_CTAG_BRIDGE_READ_CACHE_LINES=32
