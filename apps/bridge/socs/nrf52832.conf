# nRF52832 bridge (board id NRF52832_BRIDGE): 64 KiB of RAM, >= 8 KiB of it
# left free (tools/targets.yaml). Pending layouts stay in external flash.
CONFIG_CTAG_BRIDGE_BOARD_ID=4

# External SPI NOR (placeholder pins: boards/nrf52dk_nrf52832.overlay).
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Maintenance port on the UART: 1 KiB frames (the client sends 988-byte
# FONT_DATA chunks), smaller cache and buffers.
CONFIG_CTAG_BRIDGE_MAINT_MAX_FRAME=1024
CONFIG_CTAG_BRIDGE_MAINT_TX_FRAME=1536
CONFIG_CTAG_BRIDGE_MAINT_SCRATCH=512
CONFIG_CTAG_BRIDGE_READ_CACHE_LINES=8
CONFIG_CTAG_BRIDGE_READ_CACHE_LINE=64

# ---- RAM (docs/bridge-firmware.md "Memory"): what the mesh bridge does not need ----
# One advertising set: relayed and own mesh messages share it (a 5-bridge
# network), no auxiliary sets (mesh and tags use legacy PDUs only).
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
CONFIG_BT_MESH_RELAY_ADV_SETS=0
CONFIG_BT_CTLR_ADV_SET=1
# (0 does not build: ull_adv needs TICKER_ID_ADV_AUX_BASE with ADV_EXT.)
CONFIG_BT_CTLR_ADV_AUX_SET=1
CONFIG_BT_CTLR_ADV_EXT_RX_PDU_LEN_MAX=31
# Mesh scanning wants every report: no controller duplicate filter.
CONFIG_BT_CTLR_DUP_FILTER_LEN=0
CONFIG_BT_MESH_RELAY_BUF_COUNT=6
CONFIG_BT_MESH_MSG_CACHE_SIZE=16
# Only unicast requests: no delayed responses.
CONFIG_BT_MESH_ACCESS_DELAYABLE_MSG=n
# Mesh settings are stored from the system work queue.
CONFIG_BT_MESH_SETTINGS_WORKQ=n
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_ATT_TX_COUNT=6
CONFIG_CTAG_BRIDGE_ATT_INFLIGHT=4
# Bridge queues and tables.
CONFIG_CTAG_BRIDGE_EVENT_QUEUE=16
CONFIG_CTAG_BRIDGE_MESH_RXQ=6
CONFIG_CTAG_BRIDGE_MESH_TXQ=8
CONFIG_CTAG_BRIDGE_MAX_JOBS=16
CONFIG_CTAG_BRIDGE_RESULT_SLOTS=8
CONFIG_CTAG_BRIDGE_STRIP_BUF=800
CONFIG_CTAG_BRIDGE_MAINT_CREDITS=1
CONFIG_CTAG_BRIDGE_MAINT_STACK_SIZE=2048
# HCI buffers sized for what the bridge exchanges: legacy-PDU reports (58-byte
# discardable events), no event above 68 bytes (LE Read Supported Commands),
# no command above 65 bytes (31-byte mesh advertising data).
CONFIG_BT_BUF_EVT_RX_SIZE=68
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=10
CONFIG_BT_BUF_CMD_TX_SIZE=65
CONFIG_CTAG_BRIDGE_WQ_STACK_SIZE=3584
