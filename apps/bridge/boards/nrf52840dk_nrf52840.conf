# nRF52840 DK (development): the on-board MX25R6435F has 8 MiB, so the working
# space is 1 MiB (docs/fontpack.md 3; `cremind-tag fonts image` assumes the
# same for this board). Production parts keep the 16 MiB default.
CONFIG_CTAG_BRIDGE_WORKING_SPACE=1048576

# Link into code_partition (boards/*.overlay): never into the storage.
CONFIG_USE_DT_CODE_PARTITION=y
