# Cremind Tag bridge: every target. Per-SoC fragments in socs/, per-board in
# boards/ (docs/building.md). Debug logging: debug.conf (docs/bridge-firmware.md).

# ---- Libraries (docs/firmware-libs.md) ----
CONFIG_CTAG_FRAME=y
CONFIG_CTAG_CBOR=y
CONFIG_CTAG_RENDER=y
CONFIG_CTAG_FRAG=y
CONFIG_CTAG_SESSION=y

# ---- Bluetooth: the Zephyr controller (bt-ll-sw-split snippet) ----
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=y
CONFIG_BT_DEVICE_NAME="Cremind Tag bridge"
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# ATT MTU 23 (the protocol's baseline): fragments are ATT_VALUE_MAX bytes.
CONFIG_BT_L2CAP_TX_MTU=23
CONFIG_BT_BUF_ACL_RX_SIZE=27
CONFIG_BT_BUF_ACL_TX_SIZE=27
# DATA fragments in flight (CTAG_BRIDGE_ATT_INFLIGHT = 6) never exhaust these,
# so a write from the work queue never blocks on an ATT buffer.
CONFIG_BT_ATT_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_CTLR_CRYPTO=y

# ---- Bluetooth Mesh: provisionee + relay (docs/protocol.md 2) ----
CONFIG_BT_MESH=y
CONFIG_BT_MESH_PB_ADV=y
CONFIG_BT_MESH_PB_GATT=n
CONFIG_BT_MESH_PROVISIONEE=y
CONFIG_BT_MESH_GATT_PROXY=n
CONFIG_BT_MESH_FRIEND=n
CONFIG_BT_MESH_LOW_POWER=n
CONFIG_BT_MESH_CDB=n
CONFIG_BT_MESH_CFG_CLI=n
# Never the legacy advertiser: bt_mesh_suspend() can block forever with it
# (docs/firmware-notes.md correction 4).
CONFIG_BT_MESH_ADV_EXT=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_RELAY_ENABLED=y
CONFIG_BT_MESH_RELAY_RETRANSMIT_COUNT=2
CONFIG_BT_MESH_RELAY_RETRANSMIT_INTERVAL=20
CONFIG_BT_MESH_DEFAULT_TTL=5
# 160-byte vendor parameters need >= MESH_MIN_SEG segments.
CONFIG_BT_MESH_TX_SEG_MAX=16
CONFIG_BT_MESH_RX_SEG_MAX=16
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=2
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=2

# ---- Storage: mesh state and the bridge's records (settings on NVS) ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# ---- Crypto: PSA (mesh requires it; the tag session uses HMAC, SHA-256, CCM) ----
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_ENTROPY_GENERATOR=y

# ---- Kernel and drivers ----
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
# main() only starts the work queue; the boot runs on it.
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---- No console or logging in release builds (the maintenance port owns the
# serial link); debug.conf routes logs to RTT. ----
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_ASSERT=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
