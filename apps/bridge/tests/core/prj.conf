CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384

# External NOR stand-in (boards/native_sim*.overlay: 32 MiB, 4-byte writes,
# fault injection for the power-cut tests).
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR_CALLBACKS=y

# The libraries the bridge links (and the tag-side ones the fake tag uses).
CONFIG_CTAG_FRAME=y
CONFIG_CTAG_CBOR=y
CONFIG_CTAG_RENDER=y
CONFIG_CTAG_FRAG=y
CONFIG_CTAG_SESSION=y
CONFIG_CTAG_TXN=y

# PSA through Mbed TLS on the host (as tests/ztest/session).
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_ENTROPY_GENERATOR=y

# The development geometry of the nRF52840 DK is exercised as well; the
# default working space (16 MiB) on the 32 MiB simulated part puts the
# directory and the pending ring above the 16 MiB boundary.
CONFIG_CTAG_BRIDGE_WORKING_SPACE=16777216
CONFIG_CTAG_BRIDGE_MAINT_TX_FRAME=1536

# The nRF52840's two tag sessions at once (socs/nrf52840.conf; the nRF52832
# configuration of testcase.yaml has one).
CONFIG_CTAG_BRIDGE_SESSIONS=2
