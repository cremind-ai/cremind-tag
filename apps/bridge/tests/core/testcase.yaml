common:
  tags:
    - ctag
    - bridge
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
tests:
  ctag.bridge.core: {}
  # The shared core with the nRF52832 bridge's sizes (socs/nrf52832.conf).
  ctag.bridge.core.nrf52832:
    extra_configs:
      - CONFIG_CTAG_BRIDGE_MAX_TAGS=10
      - CONFIG_CTAG_BRIDGE_SESSIONS=1
      - CONFIG_CTAG_BRIDGE_MAX_JOBS=16
      - CONFIG_CTAG_BRIDGE_RESULT_SLOTS=8
      - CONFIG_CTAG_BRIDGE_STRIP_BUF=800
      - CONFIG_CTAG_RENDER_QR_SLOTS=1
      - CONFIG_CTAG_BRIDGE_READ_CACHE_LINES=8
      - CONFIG_CTAG_BRIDGE_READ_CACHE_LINE=64
      - CONFIG_CTAG_BRIDGE_MAINT_MAX_FRAME=512
      - CONFIG_CTAG_BRIDGE_MAINT_TX_FRAME=1280
      - CONFIG_CTAG_BRIDGE_MAINT_CREDITS=1
