# Built by twister (build only); interop.py runs the image against the
# companion's BridgeMaintClient (docs/bridge-firmware.md, "Tests").
common:
  tags:
    - ctag
    - bridge
  platform_allow:
    - native_sim
  build_only: true
tests:
  ctag.bridge.maint_pty: {}
  # The nRF52832 bridge's port: 512-byte frames, one credit.
  ctag.bridge.maint_pty.nrf52832:
    extra_configs:
      - CONFIG_CTAG_BRIDGE_MAINT_MAX_FRAME=512
      - CONFIG_CTAG_BRIDGE_MAINT_TX_FRAME=1280
      - CONFIG_CTAG_BRIDGE_MAINT_CREDITS=1
