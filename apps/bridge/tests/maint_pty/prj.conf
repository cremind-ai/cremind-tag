CONFIG_FLASH=y
CONFIG_SERIAL=y
CONFIG_CTAG_FRAME=y
CONFIG_CTAG_CBOR=y
CONFIG_CTAG_RENDER=y
CONFIG_CTAG_SESSION=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_ENTROPY_GENERATOR=y
# uart0 is the maintenance port (a pseudo-terminal); printk goes to stdout.
CONFIG_UART_CONSOLE=n
# The nRF52840 DK geometry: 8 MiB part, 1 MiB working space.
CONFIG_CTAG_BRIDGE_WORKING_SPACE=1048576
CONFIG_MAIN_STACK_SIZE=8192
