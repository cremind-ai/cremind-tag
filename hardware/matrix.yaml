# Cremind Tag hardware support matrix — machine-readable source for
# docs/hardware/matrix.md and the per-board qualification reports.
#
# status (per board/panel combination), in order of progress:
#   documented  - hardware facts recorded, nothing built yet
#   buildable   - secure firmware links within the exact memory geometry
#   functional  - flashed and exercised on a physical sample
#   qualified   - qualification report complete (power, endurance, faults)
#   blocked     - cannot be supported; `blocked_reason` records the measured cause
#
# Pins are decimal GPIO numbers on port 0. Source for tag hardware facts:
# EPD-nRF5 docs/devices.md (hardware documentation only; no code is used).

gateways:
  - id: nrf52840_gateway
    board_id: 1
    zephyr_board: nrf52840dk/nrf52840
    mcu: nRF52840
    flash_kib: 1024
    ram_kib: 256
    host_link: usb_cdc_acm
    status: buildable
  - id: nrf52832_gateway
    board_id: 2
    zephyr_board: nrf52dk/nrf52832
    mcu: nRF52832
    flash_kib: 512
    ram_kib: 64
    host_link: uart_ch340
    status: buildable
    notes: Links with 4.6 KiB RAM free (smaller delivery queue); stack high-water marks unmeasured, resource qualification on hardware pending.

bridges:
  - id: nrf52840_bridge
    board_id: 3
    zephyr_board: nrf52840dk/nrf52840
    mcu: nRF52840
    flash_kib: 1024
    ram_kib: 256
    external_flash: soldered NOR, capacity from `cremind-tag fonts size` (DK MX25R6435F 8 MiB is for development only)
    maintenance_link: usb_cdc_acm
    status: buildable
    notes: apps/bridge links in the exact geometry and passes verify_stack.py (flash 70 % free, 154 KiB RAM free); not flashed yet.
  - id: nrf52832_bridge
    board_id: 4
    zephyr_board: nrf52dk/nrf52832
    mcu: nRF52832
    flash_kib: 512
    ram_kib: 64
    external_flash: soldered SPI NOR
    maintenance_link: uart_ch340
    status: buildable
    notes: >-
      apps/bridge links in the exact geometry, passes verify_stack.py and meets the targets (measured 2026-09-28,
      NCS v3.4.1): 8,473 B RAM free (target 8,192), flash 44.8 % free. Layouts are assembled in external flash
      with one shared layout buffer, the maintenance port runs on the main thread with 512-byte frames, and the
      assignment table holds 10 tags (CAPS max_tags 10; the nRF52840 keeps 20), with one cached QR symbol
      (the nRF52840 keeps four). Stack sizes are estimates until
      measured; SPI NOR pins on the nRF52 DK are placeholders; not flashed yet. docs/bridge-firmware.md "Memory".

