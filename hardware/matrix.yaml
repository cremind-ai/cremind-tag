# Per-board verification checklist (docs/hardware/verification.md explains each item).
verification_items:
  - actual MCU variant and memory geometry
  - display pin mapping and signal polarity
  - panel model, resolution, colour planes and connector orientation
  - oscillators (32 MHz crystal, 32.768 kHz crystal or RC)
  - battery arrangement and supply voltage
  - power switches, external storage, wake sources and battery sensing
  - sleep current with development equipment disconnected

# Resource targets (plan section 5).
resource_targets:
  flash_headroom_pct: 15
  ram_free_kib: {nrf51: 2, nrf52810: 3, nrf52811: 3, nrf52832_bridge: 8}
