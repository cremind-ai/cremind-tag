[project]
name = "cremind-tag"
dynamic = ["version"]
description = "Cremind Tag companion: durable delivery queue, Cremind connector, multilingual layout, font packs, gateway client and enrollment"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "cbor2>=5.6",
    "cryptography>=43",
    "pyyaml>=6.0",
    # Cremind connector
    "httpx>=0.27",
    # Gateway / bridge serial links
    "pyserial>=3.5",
    # CLI
    "typer>=0.12",
    "rich>=13",
    # Secrets (tag secrets, connector credentials) in the OS credential store
    "keyring>=25",
    "platformdirs>=4",
    # Text layout: ICU (line breaking, bidi, graphemes), HarfBuzz (shaping), FreeType (rasterising)
    "pyicu-wheels>=2.15",
    "uharfbuzz>=0.40",
    "freetype-py>=2.5",
    # Previews
    "pillow>=10",
]

[project.scripts]
cremind-tag = "cremind_tag.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cremind_tag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cremind_tag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "network: needs network access (downloads pinned fonts)",
    "fonts: needs the pinned font cache (cremind-tag fonts fetch)",
    "slow: long simulated scale/fault runs (tests/scale; CREMIND_TAG_SCALE_FULL=1 for the full 200-trial run)",
]
