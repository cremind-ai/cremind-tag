name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these gates first (.github/workflows/release.yml).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NCS_REVISION: v3.4.1
  # Same paths as the local Docker workflow (docs/building.md).
  NCS_DIR: /ncs
  CTAG_BUILD_ROOT: /build
  # The toolchain image, pinned by digest: the same string as IMAGE in
  # tools/build.py and every `container:` below (tests/tools checks all three;
  # `container:` cannot read env). build.py records it in metadata.json.
  CTAG_TOOLCHAIN_IMAGE: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:45b97cad97a9967c52d77d1d1a0f7dd8fe027edd17c05c3eda2eeadc23729418

jobs:
  tools:
    name: Tools (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync the tools environment (pyproject.toml, uv.lock)
        run: uv sync --locked
      - name: Tool tests (build matrix, verify_stack, board files, contract, release tooling)
        run: uv run pytest -q
      - name: One version everywhere (VERSION, apps' Zephyr VERSION)
        run: uv run python tools/version.py --check
      - name: Generated C protocol bindings are current
        run: uv run python tools/codegen.py --check
      # The golden fixtures and the tag core conversations are produced by the host's
      # reference implementation (Cremind) and committed here; the host C tests and
      # twister check the firmware against them.
      - name: The protocol contract builds and verifies
        run: |
          uv run python tools/contract.py --out "$RUNNER_TEMP/contract"
          uv run python tools/contract.py --check "$RUNNER_TEMP/contract/cremind-tag-contract-$(cat VERSION)"

  host-c:
    name: Host C tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure, build and run
        run: |
          if [ ! -f tests/host/CMakeLists.txt ]; then
            echo "tests/host not present yet; skipping"
            exit 0
          fi
          cmake -S tests/host -B tests/host/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build tests/host/build --parallel
          ctest --test-dir tests/host/build --output-on-failure

  ncs-workspace:
    name: NCS workspace cache
    runs-on: ubuntu-latest
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:45b97cad97a9967c52d77d1d1a0f7dd8fe027edd17c05c3eda2eeadc23729418
    defaults:
      run:
        shell: bash
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: /ncs
          key: ncs-${{ env.NCS_REVISION }}-narrow-depth1-v1
          lookup-only: true
      - name: West init + update
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_REVISION" "$NCS_DIR"
          cd "$NCS_DIR"
          west update --narrow -o=--depth=1

  firmware:
    name: Firmware build matrix
    needs: ncs-workspace
    runs-on: ubuntu-latest
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:45b97cad97a9967c52d77d1d1a0f7dd8fe027edd17c05c3eda2eeadc23729418
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: /ncs
          key: ncs-${{ env.NCS_REVISION }}-narrow-depth1-v1
          fail-on-cache-miss: true
      - name: Trust the checkout (container uid differs)
        run: git config --global --add safe.directory '*'
      - name: Build, verify controller stack, check resources
        # Warnings are not errors: every image warns about the experimental
        # BT_LL_SW_SPLIT symbol (docs/firmware-notes.md correction 2).
        run: |
          set +e
          python3 tools/build.py --in-container --all
          rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::warning::Some targets were skipped because their app does not exist yet"
            rc=0
          fi
          exit "$rc"
      - name: Memory report to job summary
        if: always()
        run: |
          if [ -f build/memory-report.md ]; then
            cat build/memory-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No firmware target was built." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            build/memory-report.md
            build/memory-report.json
            build/*/zephyr.hex
            build/*/zephyr.bin
            build/*/zephyr.elf
            build/*/zephyr.map
            build/*/.config
            build/*/zephyr.dts
            build/*/verify.json
            build/*/metadata.json
            build/*/build.log

  twister:
    name: Twister (native_sim)
    needs: ncs-workspace
    runs-on: ubuntu-latest
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:45b97cad97a9967c52d77d1d1a0f7dd8fe027edd17c05c3eda2eeadc23729418
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Check for ztest suites
        id: present
        run: |
          if [ -d tests/ztest ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "tests/ztest not present yet; skipping"; fi
      - uses: actions/cache/restore@v4
        if: steps.present.outputs.run == 'true'
        with:
          path: /ncs
          key: ncs-${{ env.NCS_REVISION }}-narrow-depth1-v1
          fail-on-cache-miss: true
      - name: Run twister
        if: steps.present.outputs.run == 'true'
        run: |
          git config --global --add safe.directory '*'
          # native_sim needs make, which the toolchain image lacks (firmware-notes correction 10).
          apt-get update && apt-get install -y --no-install-recommends make
          cd "$NCS_DIR"
          # Library suites plus each app's own portable-core suites.
          app_tests=()
          for d in "$GITHUB_WORKSPACE"/apps/*/tests; do
            [ -d "$d" ] && app_tests+=(-T "$d")
          done
          west twister -T "$GITHUB_WORKSPACE/tests/ztest" "${app_tests[@]}" -p native_sim -p native_sim/native/64 \
            -x "ZEPHYR_EXTRA_MODULES=$GITHUB_WORKSPACE" \
            --outdir "$CTAG_BUILD_ROOT/twister-out" --inline-logs -v
      - uses: actions/upload-artifact@v4
        if: always() && steps.present.outputs.run == 'true'
        with:
          name: twister
          if-no-files-found: ignore
          path: |
            ${{ env.CTAG_BUILD_ROOT }}/twister-out/twister.json
            ${{ env.CTAG_BUILD_ROOT }}/twister-out/twister_report.xml
