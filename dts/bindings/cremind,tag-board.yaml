title: Cremind Tag board identity and verified hardware features

description: |
  One node per Cremind tag board (usually chosen as `cremind,tag-board`). It
  carries the protocol board id reported in CAPS and in the enrollment blob,
  and records which optional hardware features have been physically verified
  (docs/hardware/verification.md). Firmware must treat every feature that is
  not marked verified as absent.

compatible: "cremind,tag-board"

properties:
  board-id:
    type: int
    required: true
    description: Protocol board id (protocol/spec.yaml `boards`).

  wake-gpios:
    type: phandle-array
    description: |
      External wake input (button, reed switch or NFC field detect, as
      documented for the board). Only usable when wake-verified is present.

  wake-verified:
    type: boolean
    description: |
      The wake input, its polarity and its ability to leave System OFF were
      verified on hardware. CMD{SLEEP} (System OFF) is refused without it.

  hfxo-verified:
    type: boolean
    description: The high-frequency crystal frequency was verified on hardware.

  lfxo-verified:
    type: boolean
    description: |
      A 32.768 kHz crystal was verified on hardware. Until then the board
      defconfig selects the calibrated RC oscillator.

  dcdc-verified:
    type: boolean
    description: |
      The DC/DC inductor was verified on hardware; only then may firmware
      enable the DC/DC regulator (docs/firmware-notes.md section 6).
