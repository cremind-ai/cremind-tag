CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384

# The tag's lean PSA profile (docs/firmware-notes.md 12), provided by Mbed TLS
# on native_sim; one key slot as on the tags.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=1
CONFIG_ENTROPY_GENERATOR=y

CONFIG_CTAG_FRAG=y
CONFIG_CTAG_SESSION=y
CONFIG_CTAG_TXN=y
CONFIG_CTAG_ENROLL=y
