CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192

CONFIG_CTAG_FRAME=y
CONFIG_CTAG_LAYOUT=y
CONFIG_CTAG_RENDER=y
CONFIG_CTAG_FRAG=y
CONFIG_CTAG_TXN=y
CONFIG_CTAG_ENROLL=y
# Protocol v2: Noise*/HACL* on the Zephyr sys_heap (the host tests use a pool);
# test_v2_heap_failures exhausts it deliberately. The handshake tests hold an
# initiator and a responder in the one heap.
CONFIG_CTAG_SECURE=y
CONFIG_CTAG_SECURE_HEAP_SIZE=16384
