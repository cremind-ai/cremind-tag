# The tag-side libraries with the lean PSA profile (docs/firmware-notes.md 12).
CONFIG_CTAG_FRAG=y
CONFIG_CTAG_SESSION=y
CONFIG_CTAG_TXN=y
CONFIG_CTAG_ENROLL=y

CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_GENERATE_RANDOM=n
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=2
CONFIG_ENTROPY_GENERATOR=y

CONFIG_ASSERT=n
CONFIG_LOG=n
CONFIG_STACK_USAGE=y
