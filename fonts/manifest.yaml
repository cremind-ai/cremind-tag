# Cremind Tag font-pack sources, pinned (docs/fonts.md).
#
# Edit this file, then run `cremind-tag fonts lock`: it downloads every pinned
# file once into fonts/cache/, checks its size and git blob SHA-1, and records
# its SHA-256 in fonts/manifest.lock.json. Builds use only locked, verified
# files. A pack's manifest id is SHA-256(manifest.lock.json)[0:8].
#
# Face ids are stable: 0 is the icon face, the others keep the id they were
# given here. New faces take the next free id; a removed face retires its id.
schema: cremind-tag/fonts-manifest@1
pack_name: Cremind Tag Glyph Pack   # neutral name; the NOTICE says "derived from Noto"

sources:
  notofonts:
    repo: https://github.com/notofonts/notofonts.github.io
    ref: noto-monthly-release-2026.09.01
    commit: 76fff9eee60dcef8381bfcae8d0b4311e2186e67
    url_template: https://raw.githubusercontent.com/notofonts/notofonts.github.io/{commit}/{path}
  noto-cjk:
    repo: https://github.com/notofonts/noto-cjk
    ref: Sans2.004
    commit: 523d033d6cb47f4a80c58a35753646f5c3608a78
    url_template: https://raw.githubusercontent.com/notofonts/noto-cjk/{commit}/{path}
  google-fonts:
    repo: https://github.com/google/fonts
    ref: main (Noto Emoji 3.002)
    commit: b979dba422e445492b0eb9951ac52ee0b4d648c3
    url_template: https://raw.githubusercontent.com/google/fonts/{commit}/{path}
  material-icons:
    repo: https://github.com/google/material-design-icons
    ref: master (font/ unchanged since this commit)
    commit: f7bd4f25f3764883717c09a1fd867f560c9a9581
    url_template: https://raw.githubusercontent.com/google/material-design-icons/{commit}/{path}

# Licence texts shipped with every pack (committed under fonts/LICENSES/).
licenses:
  - id: OFL-1.1
    file: LICENSES/OFL-1.1.txt
    source: notofonts
    path: fonts/LICENSE
    size: 4374
    git_blob_sha1: 9651ea7d51c39a7778cc327a423fb200350aa948
  - id: Apache-2.0
    file: LICENSES/Apache-2.0.txt
    source: material-icons
    path: LICENSE
    size: 11357
    git_blob_sha1: 7a4a3ea2424c09fbe48d455aed1eaa94d9124835

# Unicode Character Database files for `cremind-tag fonts coverage`.
unicode:
  version: "17.0.0"
  url_template: https://www.unicode.org/Public/{version}/ucd/{path}
  files: [Scripts.txt, ScriptExtensions.txt, PropertyValueAliases.txt]

render:
  engine: freetype
  freetype: "2.13.2"      # the library freetype-py bundles; builds refuse any other version
  freetype_py: "2.5.1"
  # Every glyph id 0..numGlyphs-1 is rendered with FT_LOAD_RENDER | FT_LOAD_TARGET_MONO
  # plus the flags of its hinting mode: native = the font's own hinter (TrueType
  # bytecode, interpreter v40 / Adobe CFF engine), autohint = FT_LOAD_FORCE_AUTOHINT
  # (FreeType's auto-fitter), none = FT_LOAD_NO_HINTING. In 1 bpp the fonts' own
  # hinting leaves vertical stems 1 or 2 px wide depending on their sub-pixel
  # position (compared on Noto Sans, Arabic, Devanagari, Oriya, SC and JP); the
  # auto-fitter's mono mode snaps both directions, so every text face uses it.
  hinting:
    truetype-bytecode: autohint
    none: autohint              # TrueType without instructions (FreeType would auto-hint them anyway)
    cff: autohint
  icons: none                   # Material Icons are drawn on a 24 px grid; keep their geometry exact

# Build profiles. `faces: all` = every face except role `optional`.
profiles:
  full:
    faces: all
    text_sizes: [16, 24, 32]
    icon_sizes: [16, 24, 32, 48]
  dev:
    # Development only: fits the nRF52840 DK's 8 MiB MX25R6435F with a reduced working space.
    faces: [material-icons, noto-sans, noto-sans-arabic, noto-sans-hebrew, noto-sans-thai, noto-sans-devanagari]
    text_sizes: [16, 24]
    icon_sizes: [16, 24, 32, 48]
    flash_size: 8388608
    working_space: 1048576

